name: Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Decode upload keystore
        working-directory: apps/android
        env:
          MYDRIVE_KEYSTORE_BASE64: ${{ secrets.MYDRIVE_KEYSTORE_BASE64 }}
          MYDRIVE_STORE_PASSWORD: ${{ secrets.MYDRIVE_STORE_PASSWORD }}
          MYDRIVE_KEY_PASSWORD: ${{ secrets.MYDRIVE_KEY_PASSWORD }}
          MYDRIVE_KEY_ALIAS: ${{ secrets.MYDRIVE_KEY_ALIAS }}
        run: |
          if [ -z "$MYDRIVE_KEYSTORE_BASE64" ]; then
            echo "::error::MYDRIVE_KEYSTORE_BASE64 is not visible to this job. Add repository secrets (not GitHub Environment secrets). This workflow does not set jobs.apk.environment."
            exit 1
          fi
          echo "$MYDRIVE_KEYSTORE_BASE64" | base64 -d > mydrive-upload.jks
          printf '%s\n' \
            'storeFile=mydrive-upload.jks' \
            "storePassword=$MYDRIVE_STORE_PASSWORD" \
            "keyAlias=${MYDRIVE_KEY_ALIAS:-mydrive}" \
            "keyPassword=${MYDRIVE_KEY_PASSWORD:-$MYDRIVE_STORE_PASSWORD}" \
            > keystore.properties
      - name: Assemble release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - id: apk
        uses: ./.github/actions/upload-named-android-apk
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          apk="${{ steps.apk.outputs.path }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --generate-notes --title "$tag"
          fi
