services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ../.env
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_UPSTREAM_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_UPSTREAM_PORT:-9001}:9001"

  musicdl:
    build:
      context: ../services/musicdl-export
      dockerfile: Dockerfile
    image: musicdl-export:local
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=512m
      - /home/musicdl:rw,nosuid,nodev,uid=1000,gid=1000,mode=700,size=128m
    environment:
      MUSICDL_SOURCES: ${MUSICDL_SOURCES:-MiguMusicClient,NeteaseMusicClient,QQMusicClient,KuwoMusicClient,QianqianMusicClient}
      MUSICDL_SEARCH_SIZE: ${MUSICDL_SEARCH_SIZE:-3}
      MUSICDL_SEARCH_DEADLINE: ${MUSICDL_SEARCH_DEADLINE:-20}
    volumes:
      - musicdl-downloads:/downloads
    ports:
      - "127.0.0.1:8090:8090"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    image: ghcr.io/jasensic/my-drive-api:latest
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mydrive}:${POSTGRES_PASSWORD:-mydrive}@127.0.0.1:5432/${POSTGRES_DB:-mydrive}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      MDNS_ENABLE: "true"
      MUSICDL_URL: http://127.0.0.1:8090
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      musicdl:
        condition: service_healthy

  web:
    image: ghcr.io/jasensic/my-drive-web:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_UPSTREAM: http://host.docker.internal:${API_HTTP_PORT:-8080}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8088}:80"

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - web
      - minio

  npm-bootstrap:
    image: curlimages/curl:8.12.1
    network_mode: host
    depends_on:
      - nginx-proxy-manager
    environment:
      NPM_API: http://127.0.0.1:${NPM_ADMIN_PORT:-81}
      NPM_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL:-admin@example.com}
      NPM_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD:-changeme}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-s3.localhost}
      MINIO_CONSOLE_DOMAIN: ${MINIO_CONSOLE_DOMAIN:-console.localhost}
      PORTAL_UPSTREAM_HOST: 127.0.0.1
      PORTAL_UPSTREAM_PORT: ${PORTAL_HTTP_PORT:-8088}
      API_UPSTREAM_HOST: 127.0.0.1
      API_UPSTREAM_PORT: ${API_HTTP_PORT:-8080}
      MINIO_UPSTREAM_HOST: 127.0.0.1
      MINIO_UPSTREAM_PORT: ${MINIO_UPSTREAM_PORT:-9000}
      MINIO_CONSOLE_UPSTREAM_HOST: 127.0.0.1
      MINIO_CONSOLE_UPSTREAM_PORT: ${MINIO_CONSOLE_UPSTREAM_PORT:-9001}
    volumes:
      - ./npm/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval ${WATCHTOWER_POLL_INTERVAL:-300} --cleanup
    environment:
      WATCHTOWER_INCLUDE_STOPPED: "false"

volumes:
  pgdata:
  miniodata:
  musicdl-downloads:
  npm-data:
  npm-letsencrypt:
