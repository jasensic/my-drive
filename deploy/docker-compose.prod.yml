services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ../.env
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  musicdl:
    build:
      context: ../services/musicdl-export
      dockerfile: Dockerfile
    image: musicdl-export:local
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=512m
      - /home/musicdl:rw,nosuid,nodev,uid=1000,gid=1000,mode=700,size=128m
    environment:
      MUSICDL_SOURCES: ${MUSICDL_SOURCES:-MiguMusicClient,NeteaseMusicClient,QQMusicClient,KuwoMusicClient,QianqianMusicClient}
      MUSICDL_SEARCH_SIZE: ${MUSICDL_SEARCH_SIZE:-3}
      MUSICDL_SEARCH_DEADLINE: ${MUSICDL_SEARCH_DEADLINE:-20}
    volumes:
      - musicdl-downloads:/downloads
    ports:
      - "127.0.0.1:8090:8090"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    image: ghcr.io/jasensic/my-drive-api:latest
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mydrive}:${POSTGRES_PASSWORD:-mydrive}@127.0.0.1:5432/${POSTGRES_DB:-mydrive}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      MDNS_ENABLE: "true"
      MUSICDL_URL: http://127.0.0.1:8090
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      musicdl:
        condition: service_healthy

  web:
    image: ghcr.io/jasensic/my-drive-web:latest
    restart: unless-stopped
    network_mode: host
    environment:
      # nginx in the image proxies /v1 to 127.0.0.1:8080 when using host network
      API_UPSTREAM: http://127.0.0.1:8080
    depends_on:
      - api
    ports:
      - "80:80"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval ${WATCHTOWER_POLL_INTERVAL:-300} --cleanup
    environment:
      WATCHTOWER_INCLUDE_STOPPED: "false"

volumes:
  pgdata:
  miniodata:
  musicdl-downloads:
