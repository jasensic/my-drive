services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydrive}
      POSTGRES_DB: ${POSTGRES_DB:-mydrive}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydrive} -d ${POSTGRES_DB:-mydrive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mydrive}:${POSTGRES_PASSWORD:-mydrive}@postgres:5432/${POSTGRES_DB:-mydrive}
      MINIO_ENDPOINT: http://minio:9000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost}
      MDNS_ENABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  miniodata:
