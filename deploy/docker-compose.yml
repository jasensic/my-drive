# my-drive en el NAS (Linux). Un único entorno: se construye desde el repo.
# Desde la raíz del repo:
#   git pull && git submodule update --init
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# El API usa red host para que el anuncio mDNS llegue a los móviles de la LAN
# (el multicast no atraviesa la red bridge). Por eso Postgres, MinIO y musicdl
# publican sus puertos solo en 127.0.0.1 y el API los alcanza por loopback.
# Solo el API (:8080) y el portal (:8088) quedan expuestos a la LAN.
#
# El portal (nginx) llega al API por la puerta de enlace fija de la red de Compose
# (172.29.0.1). Funciona en Linux y en Docker Desktop (Windows/macOS), donde el API
# queda en la red del VM: el portal va, pero ni el API :8080 ni mDNS llegan a la LAN.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydrive}
      POSTGRES_DB: ${POSTGRES_DB:-mydrive}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  musicdl:
    build:
      context: ../services
      dockerfile: Dockerfile
    image: musicdl-server:local
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=512m
      - /home/musicdl:rw,nosuid,nodev,uid=1000,gid=1000,mode=700,size=128m
    environment:
      MUSICDL_SOURCES: ${MUSICDL_SOURCES:-MiguMusicClient,NeteaseMusicClient,QQMusicClient,KuwoMusicClient,QianqianMusicClient}
      MUSICDL_SEARCH_SIZE: ${MUSICDL_SEARCH_SIZE:-3}
      MUSICDL_SEARCH_DEADLINE: ${MUSICDL_SEARCH_DEADLINE:-20}
    volumes:
      - musicdl-downloads:/downloads
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mydrive}:${POSTGRES_PASSWORD:-mydrive}@127.0.0.1:5432/${POSTGRES_DB:-mydrive}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MUSICDL_URL: http://127.0.0.1:8090
      API_HOST: 0.0.0.0
      API_PORT: ${API_HTTP_PORT:-8080}
      MDNS_ENABLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      musicdl:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # The API runs on the host network, so nginx reaches it through this network's fixed
      # gateway. host.docker.internal does not work: on Docker Desktop it points at the
      # Windows/macOS host (and resolves to an unreachable IPv6 address too).
      API_UPSTREAM: http://172.29.0.1:${API_HTTP_PORT:-8080}
    depends_on:
      - api
    ports:
      - "${PORTAL_HTTP_PORT:-8088}:80"

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

volumes:
  pgdata:
  miniodata:
  musicdl-downloads:
