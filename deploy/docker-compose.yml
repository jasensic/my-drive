services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydrive}
      POSTGRES_DB: ${POSTGRES_DB:-mydrive}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydrive} -d ${POSTGRES_DB:-mydrive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  musicdl:
    build:
      context: ../services/musicdl-export
      dockerfile: Dockerfile
    image: musicdl-export:local
    init: true
    stdin_open: true
    tty: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=512m
      - /home/musicdl:rw,nosuid,nodev,uid=1000,gid=1000,mode=700,size=128m
    environment:
      MUSICDL_SOURCES: ${MUSICDL_SOURCES:-MiguMusicClient,NeteaseMusicClient,QQMusicClient,KuwoMusicClient,QianqianMusicClient}
      MUSICDL_SEARCH_SIZE: ${MUSICDL_SEARCH_SIZE:-3}
      MUSICDL_SEARCH_DEADLINE: ${MUSICDL_SEARCH_DEADLINE:-20}
    volumes:
      - musicdl-downloads:/downloads
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mydrive}:${POSTGRES_PASSWORD:-mydrive}@postgres:5432/${POSTGRES_DB:-mydrive}
      MINIO_ENDPOINT: http://minio:9000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://api.localhost}
      MDNS_ENABLE: "false"
      MUSICDL_URL: http://musicdl:8090
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      musicdl:
        condition: service_healthy
    ports:
      - "${API_HTTP_PORT:-8080}:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8088}:80"

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - web
      - minio

  npm-bootstrap:
    image: curlimages/curl:8.12.1
    depends_on:
      - nginx-proxy-manager
    environment:
      NPM_API: http://nginx-proxy-manager:81
      NPM_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL:-admin@example.com}
      NPM_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD:-changeme}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-s3.localhost}
      MINIO_CONSOLE_DOMAIN: ${MINIO_CONSOLE_DOMAIN:-console.localhost}
      PORTAL_UPSTREAM_HOST: ${PORTAL_UPSTREAM_HOST:-web}
      PORTAL_UPSTREAM_PORT: ${PORTAL_UPSTREAM_PORT:-80}
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-api}
      API_UPSTREAM_PORT: ${API_UPSTREAM_PORT:-8080}
      MINIO_UPSTREAM_HOST: ${MINIO_UPSTREAM_HOST:-minio}
      MINIO_UPSTREAM_PORT: ${MINIO_UPSTREAM_PORT:-9000}
      MINIO_CONSOLE_UPSTREAM_HOST: ${MINIO_CONSOLE_UPSTREAM_HOST:-minio}
      MINIO_CONSOLE_UPSTREAM_PORT: ${MINIO_CONSOLE_UPSTREAM_PORT:-9001}
    volumes:
      - ./npm/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

volumes:
  pgdata:
  miniodata:
  musicdl-downloads:
  npm-data:
  npm-letsencrypt:
