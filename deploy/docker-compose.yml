services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydrive}
      POSTGRES_DB: ${POSTGRES_DB:-mydrive}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydrive} -d ${POSTGRES_DB:-mydrive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  musicdl:
    build:
      context: ../services/musicdl-export
      dockerfile: Dockerfile
    image: musicdl-export:local
    init: true
    stdin_open: true
    tty: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=512m
      - /home/musicdl:rw,nosuid,nodev,uid=1000,gid=1000,mode=700,size=128m
    environment:
      MUSICDL_SOURCES: ${MUSICDL_SOURCES:-MiguMusicClient,NeteaseMusicClient,QQMusicClient,KuwoMusicClient,QianqianMusicClient}
      MUSICDL_SEARCH_SIZE: ${MUSICDL_SEARCH_SIZE:-3}
      MUSICDL_SEARCH_DEADLINE: ${MUSICDL_SEARCH_DEADLINE:-20}
    volumes:
      - musicdl-downloads:/downloads
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mydrive}:${POSTGRES_PASSWORD:-mydrive}@postgres:5432/${POSTGRES_DB:-mydrive}
      MINIO_ENDPOINT: http://minio:9000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost}
      MDNS_ENABLE: "false"
      MUSICDL_URL: http://musicdl:8090
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      musicdl:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  miniodata:
  musicdl-downloads:
