server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    # Resolve the API at request time so nginx can start before the `api`
    # container is in Docker DNS (and after it is recreated).
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    location /v1/ {
        set $api_upstream ${API_UPSTREAM_HOST};
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Range $http_range;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /api-docs {
        set $api_upstream ${API_UPSTREAM_HOST};
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location /health {
        set $api_upstream ${API_UPSTREAM_HOST};
        proxy_pass http://$api_upstream/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
